name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Runs on pushes to the main branch

permissions:
  contents: write # Required to push the build output to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Build and Export Next.js 🚀
        run: npm run build

      - name: Deploy to GitHub Pages 🌐
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out # The static export folder containing HTML, CSS, JS
          branch: gh-pages # The target branch for GitHub Pages
